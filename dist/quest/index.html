<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#193e35">
  <meta name="description" content="知行學院 Quest｜國中三年六學期全科遊戲化學習平台。依 108 課綱展開 188 個核心單元，每天一小關，搞懂觀念，累積學習能量！">
  <title>知行學院 Quest 闖關｜國中三年全科遊戲化學習</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23193e35'/%3E%3Cpath d='M28 28 h24 l8 10 l8 -10 h16 v44 h-22 l-6 8 l-6 -8 h-22 z' fill='%23d6fa77'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./quest.css?v=20261103v2">
  <link rel="stylesheet" href="./learning-path.css?v=20261103v2">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <div id="game"></div>
  <dialog id="figure-dialog" class="figure-dialog" aria-labelledby="figure-dialog-title">
    <header>
      <div class="figure-dialog-title-wrap">
        <span class="figure-dialog-badge">🔍 高清觀念圖解</span>
        <h2 id="figure-dialog-title">觀念圖解</h2>
      </div>
      <div class="figure-dialog-actions">
        <button class="btn ghost small" id="fig-zoom-out" type="button" aria-label="縮小圖解" title="縮小 (Zoom Out)">🔍−</button>
        <span id="fig-zoom-level" class="fig-zoom-badge" title="目前縮放比例">100%</span>
        <button class="btn ghost small" id="fig-zoom-in" type="button" aria-label="放大圖解" title="放大 (Zoom In)">🔍+</button>
        <button class="btn ghost small" id="fig-zoom-reset" type="button" aria-label="重設比例" title="重設 (100%)">↺</button>
        <form method="dialog" style="display:inline;"><button class="btn ghost small" aria-label="關閉放大圖解">關閉 ✕</button></form>
      </div>
    </header>
    <div class="figure-dialog-scaffold" aria-label="圖解思考三步階梯">
      <span class="scaffold-step"><b>1. 找對象</b> 釐清圖中的核心主角、座標與變因</span>
      <span class="scaffold-step"><b>2. 讀關係</b> 判讀箭頭流向、增減趨勢與比例關係</span>
      <span class="scaffold-step"><b>3. 驗界線</b> 核對公式適用條件與考場高頻避坑點</span>
    </div>
    <div class="figure-dialog-scroll" tabindex="0" role="region" aria-label="可縮放拖曳的高清圖解畫布">
      <div id="figure-dialog-content"></div>
    </div>
  </dialog>
  <noscript>請開啟 JavaScript 才能進行闖關自學。<a href="../#/courses">前往完整教材地圖</a></noscript>
  <script type="module" src="./view.mjs?v=20261103v2"></script>
</body>
</html>
